name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
        env:
          MPLBACKEND: Agg
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[studio,dev]"
      - run: python -c "from aerogel_studio.app import StudioWindow; from aerogel_studio.backend import process_command; print('Desktop imports OK')"
      - run: python -m pytest
        env:
          MPLBACKEND: Agg
          QT_API: pyside6
